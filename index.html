<title>Instrumenthäftet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,800;1,6..96,700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Layout: a music exercise book. The page is stave paper (5-line staffs), headings set like an engraved score title, everything you "write" in ballpoint handwriting. Six instrument groups each get their own ink colour, used as tabs and bins. Progress is drawn as notes on a staff. */
:root{
  --desk:#d9dde3; --paper:#fcfcf9; --paper-2:#eff0ec; --rule:#d6dbe6; --edge:#c7cbd2; --hole:#c1c6cf;
  --ink:#1f1d26; --ink-soft:#5f6070; --pencil:#686b75; --red:#c4372b; --green:#277a42;
  --hl:rgba(255,231,46,.6); --shadow:rgba(25,25,40,.16);
  --g-bleck:#a8770a; --g-tra:#8a5229; --g-strak:#a4243e; --g-strang:#1d7472; --g-tangent:#3b48b0; --g-slag:#c25a14;
  --f-title:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-body:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --f-music:"Noto Music","Segoe UI Symbol","Apple Symbols",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0f1116; --paper:#1b1d26; --paper-2:#242734; --rule:#2c3040; --edge:#2a2d3a; --hole:#2f3343;
  --ink:#ecebf3; --ink-soft:#a6a8ba; --pencil:#a1a4b2; --red:#ff7d6c; --green:#72d590;
  --hl:rgba(255,220,60,.3); --shadow:rgba(0,0,0,.5);
  --g-bleck:#e6b33a; --g-tra:#d39462; --g-strak:#f0738a; --g-strang:#55c9c3; --g-tangent:#9aa5ff; --g-slag:#ff9a52; color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0f1116; --paper:#1b1d26; --paper-2:#242734; --rule:#2c3040; --edge:#2a2d3a; --hole:#2f3343;
  --ink:#ecebf3; --ink-soft:#a6a8ba; --pencil:#a1a4b2; --red:#ff7d6c; --green:#72d590;
  --hl:rgba(255,220,60,.3); --shadow:rgba(0,0,0,.5);
  --g-bleck:#e6b33a; --g-tra:#d39462; --g-strak:#f0738a; --g-strang:#55c9c3; --g-tangent:#9aa5ff; --g-slag:#ff9a52; color-scheme:dark }

*{box-sizing:border-box}
html{font-size:18px}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45;
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--red);outline-offset:3px}

.page{position:relative;max-width:1040px;margin:0 auto;background-color:var(--paper);
  background-image:linear-gradient(to bottom,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent 9px,var(--rule) 9px,var(--rule) 10px,transparent 10px,transparent 18px,var(--rule) 18px,var(--rule) 19px,transparent 19px,transparent 27px,var(--rule) 27px,var(--rule) 28px,transparent 28px,transparent 36px,var(--rule) 36px,var(--rule) 37px,transparent 37px);
  background-size:100% 80px;background-position:0 30px;
  padding:26px 30px 40px 80px;border-radius:4px;box-shadow:0 1px 0 var(--edge),0 12px 30px var(--shadow)}
.page::before{content:"";position:absolute;left:16px;top:18px;bottom:18px;width:26px;
  background:radial-gradient(circle,var(--desk) 0 8px,var(--hole) 8px 9.5px,transparent 10px) center 10px/26px 80px repeat-y}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:flex-end;gap:12px}
.clef{font-family:var(--f-music);font-size:4.2rem;line-height:.8;color:var(--ink)}
.brand h1{font-family:var(--f-title);font-weight:800;font-size:2.3rem;margin:0;line-height:1;letter-spacing:-.01em}
.brand p{margin:.2rem 0 0;font-family:var(--f-hand);color:var(--pencil)}
.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:var(--paper);padding:.3rem 1.1rem .2rem;border-radius:10px 12px 4px 4px;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;border-bottom-width:4px}
.tab[aria-pressed="true"]{background:var(--hl)}
.sound{white-space:nowrap;border:2px dashed var(--ink-soft);background:var(--paper);border-radius:20px;padding:.2rem .8rem;font-family:var(--f-hand);display:inline-flex;gap:6px;align-items:center}
.sound[aria-pressed="false"]{opacity:.65}

h2.title{font-family:var(--f-title);font-weight:800;font-size:2rem;margin:0;line-height:1.05;text-wrap:balance}
h3.title{font-family:var(--f-title);font-weight:700;font-style:italic;font-size:1.35rem;margin:0}
.eyebrow{font-family:var(--f-hand);font-size:.95rem;color:var(--red);font-weight:700}
.pencil{color:var(--pencil)} .small{font-size:.88rem} .mt{margin-top:22px} .hand{font-family:var(--f-hand)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* group colour helper */
[data-g="bleck"]{--gc:var(--g-bleck)} [data-g="tra"]{--gc:var(--g-tra)} [data-g="strak"]{--gc:var(--g-strak)}
[data-g="strang"]{--gc:var(--g-strang)} [data-g="tangent"]{--gc:var(--g-tangent)} [data-g="slag"]{--gc:var(--g-slag)}
.gicon{width:26px;height:26px;flex:none;color:var(--gc,var(--ink))}

/* study */
.intro{max-width:62ch;font-size:1.1rem;margin:4px 0 18px}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:760px){.groups{grid-template-columns:1fr}}
.gcard{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:6px 10px 7px 9px;padding:16px 16px 14px;box-shadow:3px 4px 0 var(--paper-2)}
.gcard::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:8px;background:var(--gc);border-radius:6px 10px 0 0}
.gcard header{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.gcard header .fam{margin-left:auto;font-family:var(--f-hand);color:var(--pencil);font-size:.9rem}
.gcard p{margin:0 0 10px}
.sub{font-family:var(--f-hand);font-weight:700;font-size:.95rem;color:var(--gc);margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ichip{border:1.5px solid var(--gc);background:var(--paper);border-radius:999px;padding:.12rem .7rem .1rem;font-family:var(--f-hand);font-size:1.05rem;display:inline-flex;align-items:center;gap:6px}
.ichip .spk{width:14px;height:14px;color:var(--gc)}
.ichip.sel{background:var(--hl)}
.ichip.cov .nm{color:transparent;background:repeating-linear-gradient(-55deg,var(--pencil) 0 2px,transparent 2px 6px);opacity:.55;border-radius:3px;min-width:4.5em;display:inline-block}
.desc{margin-top:10px;padding:8px 10px;border-left:3px solid var(--gc);background:var(--paper-2);font-size:1.02rem;min-height:2.6em}
.remember{margin-top:10px;border:2px dashed var(--red);padding:8px 10px;border-radius:6px;font-size:1rem}
.remember b{color:var(--red)}
.sizes{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-hand);font-size:.95rem}
.sizes i{display:block;width:12px;border-radius:6px 6px 3px 3px;background:var(--gc)}
.notes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:26px}
@media (max-width:760px){.notes2{grid-template-columns:1fr}}
.notebox{border:2px solid var(--ink-soft);border-radius:8px;padding:12px 16px;background:var(--paper)}
.notebox ul{margin:6px 0 0;padding-left:1.2rem}
.notebox li{margin:4px 0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--ink-soft);border-radius:8px;padding:.25rem .7rem;background:var(--paper);font-family:var(--f-hand)}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--hl)}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--f-hand);font-weight:700;font-size:1.15rem;
  padding:.45rem 1.2rem .35rem;border-radius:12px 8px 14px 9px;display:inline-flex;align-items:center;gap:8px;box-shadow:2px 3px 0 var(--ink-soft)}
.btn:active{transform:translate(2px,3px);box-shadow:none}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.hl{background:var(--hl);color:var(--ink)}
.btn svg{width:22px;height:22px}

/* setup */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0 18px}
.mode{border:2px solid var(--ink);background:var(--paper);border-radius:8px 12px 7px 10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--f-title);font-size:1.1rem}
.mode span{font-size:.98rem;color:var(--ink-soft)}
.mode em{font-style:normal;font-size:.85rem;color:var(--pencil)}
.mode[aria-pressed="true"]{background:var(--hl);box-shadow:3px 3px 0 var(--ink)}

/* game */
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-bottom:8px;font-family:var(--f-hand);font-size:1.1rem}
.stat{font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-hand);font-weight:700;border:2px solid var(--red);color:var(--red);padding:0 8px;border-radius:4px;transform:rotate(-2deg);display:inline-block}
.timer{height:8px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;width:150px}
.timer i{display:block;height:100%;background:var(--red);width:100%}
.hearts svg{width:22px;height:22px;margin-right:2px}
.staffwrap{overflow-x:auto;margin:0 0 14px}
svg.staff{display:block;height:74px}
.st-line{stroke:var(--ink-soft);stroke-width:1}
.st-clef{font-family:var(--f-music);font-size:46px;fill:var(--ink)}
.n-ok{fill:var(--ink)} .n-bad{fill:var(--red)} .n-todo{fill:none;stroke:var(--pencil);stroke-width:1.4;opacity:.6} .n-now{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.stem-ok{stroke:var(--ink);stroke-width:1.6} .stem-bad{stroke:var(--red);stroke-width:1.6}
.qcard{max-width:780px}
.method{font-family:var(--f-hand);font-weight:700;color:var(--red);font-size:1rem}
.prompt{font-family:var(--f-hand);font-weight:700;font-size:1.7rem;line-height:1.2;margin:.1rem 0 1rem;text-wrap:balance}
.help{color:var(--pencil);margin:0 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.opts.three{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.opts,.opts.three{grid-template-columns:1fr}}
.opt{border:2px solid var(--gc,var(--ink));background:var(--paper);border-radius:9px 13px 8px 12px;padding:.5rem .75rem;font-size:1.2rem;text-align:left;display:flex;gap:10px;align-items:center;min-height:54px;color:var(--ink)}
.opt:hover:not(:disabled){background:var(--paper-2)}
.opt .k{font-family:var(--f-hand);font-size:.8rem;color:var(--ink-soft);border:1.5px solid var(--ink-soft);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.good{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt.bad{border-color:var(--red);color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.opt:disabled{cursor:default}
.statement{font-family:var(--f-hand);font-size:1.5rem;line-height:1.3;border-left:4px solid var(--ink);padding:4px 0 4px 14px;margin:0 0 16px}
.tfopts{display:flex;gap:14px;flex-wrap:wrap}
.tfopts .opt{min-width:150px;justify-content:center;font-size:1.5rem;font-family:var(--f-hand);font-weight:700}
.player{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.play{width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--hl);display:grid;place-items:center;flex:none;box-shadow:3px 3px 0 var(--ink-soft)}
.play svg{width:30px;height:30px}
.play:active{transform:translate(2px,2px);box-shadow:none}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px}
.eq i{width:6px;height:6px;background:var(--ink);border-radius:2px}
.eq.on i{animation:eq .6s ease-in-out infinite alternate}
.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}.eq.on i:nth-child(5){animation-delay:.1s}
@keyframes eq{from{height:6px}to{height:32px}}
.spell{display:flex;gap:10px;flex-wrap:wrap}
.spell input{flex:1 1 200px;min-width:0;border:0;border-bottom:3px solid var(--ink);background:transparent;font-family:var(--f-hand);font-size:1.8rem;padding:2px 4px;outline:none}
.spell input:focus{background:var(--hl)}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.keys button{border:1.5px solid var(--ink-soft);background:var(--paper);border-radius:6px;min-width:42px;height:38px;font-size:1.1rem}
/* order */
.slots{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.slot{min-width:150px;min-height:52px;border:2px dashed var(--ink-soft);border-radius:8px;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:1.2rem;font-family:var(--f-hand)}
.slot .no{font-family:var(--f-title);font-size:1.3rem;color:var(--red)}
.slot.full{border-style:solid;border-color:var(--ink)}
.slot.good{border-color:var(--green);color:var(--green)} .slot.bad{border-color:var(--red);color:var(--red)}
.pool{display:flex;gap:10px;flex-wrap:wrap}
/* sort board */
.tray{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--paper);border:2px dashed var(--ink-soft);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:56px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:4px 7px 5px 6px;padding:.15rem .65rem;font-family:var(--f-hand);font-size:1.08rem;box-shadow:2px 2px 0 var(--paper-2);cursor:grab}
.chip:nth-child(3n){transform:rotate(-1.5deg)} .chip:nth-child(3n+1){transform:rotate(1deg)}
.chip.sel{background:var(--hl);box-shadow:2px 2px 0 var(--ink)}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{border:2px solid var(--gc);border-radius:8px;background:var(--paper);min-height:110px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.bin .bh{display:flex;align-items:center;gap:6px;font-family:var(--f-title);font-weight:700;font-size:.95rem;color:var(--gc)}
.bin .in{display:flex;flex-wrap:wrap;gap:4px}
.bin .in span{font-family:var(--f-hand);font-size:.95rem;border-bottom:2px solid var(--gc);padding:0 3px}
.bin.over{background:var(--hl)}
.bin.flash{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-130%) rotate(-3deg);border:2px solid var(--ink);background:var(--hl);color:var(--ink);font-family:var(--f-hand);font-size:1.15rem;padding:.15rem .7rem;border-radius:5px;box-shadow:3px 4px 0 var(--shadow)}
.dragmsg{min-height:1.4em;color:var(--red);font-family:var(--f-hand);margin:8px 0 0}
.fb{margin-top:18px;padding:12px 16px;border-left:4px solid currentColor;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.fb .say{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1.15;transform:rotate(-1.2deg);transform-origin:left}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
.fb .more{color:var(--ink);font-size:1.08rem}
/* result */
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px 36px;align-items:center}
@media (max-width:640px){.result{grid-template-columns:1fr}}
.grade{position:relative;width:200px;height:150px;display:grid;place-items:center;color:var(--red)}
.grade svg{position:absolute;inset:0;width:100%;height:100%}
.grade .sc{font-family:var(--f-hand);font-weight:700;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.stars svg{width:44px;height:44px}
.comment{font-family:var(--f-hand);font-weight:700;color:var(--red);font-size:1.8rem;transform:rotate(-2deg);display:inline-block;margin:6px 0}
.missed{margin:8px 0 0;padding:0;list-style:none}
.missed li{border-bottom:1px solid var(--rule);padding:4px 0;font-size:1.08rem;display:flex;gap:8px;flex-wrap:wrap}
.missed .ans{color:var(--green);font-weight:700}
.credit{margin-top:34px;font-size:.8rem;color:var(--pencil)}
.credit a{color:inherit}
@media (prefers-reduced-motion:reduce){.eq.on i,.bin.flash{animation:none}}
@media (max-width:640px){
  .page{padding:18px 14px 30px 42px}
  .page::before{left:6px;width:20px;background-size:20px 80px;background-image:radial-gradient(circle,var(--desk) 0 6px,var(--hole) 6px 7.5px,transparent 8px)}
  .brand h1{font-size:1.8rem} .clef{font-size:3.3rem}
  .prompt{font-size:1.45rem}
}
</style>

<div class="page" id="app"></div>

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

let soundOn=true,AC=null,curAudio=null,playingId=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t,dur,type='triangle',vol=.16){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function sfx(k){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime;
  if(k==='ok'){tone(659.3,t,.15);tone(784,t+.1,.25)}
  else if(k==='bad'){tone(207.7,t,.3,'sawtooth',.05);tone(196,t,.3,'sawtooth',.05)}
  else if(k==='drop'){tone(1046.5,t,.08,'sine',.08)}}
let NOISE=null;
function noise(c){if(NOISE)return NOISE;const b=c.createBuffer(1,c.sampleRate*1,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISE=b}
function nhit(c,t,dur,ftype,freq,q,vol){const s=c.createBufferSource();s.buffer=noise(c);const f=c.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+dur+.02)}
function kick(c,t){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.4)}
function synthPerc(id){
  const c=ac();if(!c)return 0;const t=c.currentTime+.05;
  if(id==='trumset'){const s=.27;for(let i=0;i<8;i++){nhit(c,t+i*s,.05,'highpass',7000,.7,.25);if(i%4===0||i===5)kick(c,t+i*s);if(i%4===2){nhit(c,t+i*s,.18,'bandpass',1900,.8,.7);tone(185,t+i*s,.12,'triangle',.2)}}
    nhit(c,t+8*s,.9,'highpass',5000,.5,.35);kick(c,t+8*s);return 3.2}
  if(id==='maracas'){const s=.2;for(let i=0;i<12;i++)nhit(c,t+i*s,.07,'bandpass',6500,1.2,i%2?.35:.7);return 2.6}
  if(id==='tamburin'){const s=.25;for(let i=0;i<9;i++){const v=i%2?.35:.75;nhit(c,t+i*s,.22,'bandpass',8500,3,v);nhit(c,t+i*s,.15,'bandpass',11000,4,v*.6)}return 2.6}
  if(id==='claves'){const st=.17;[0,3,6,10,12,16,19,22,26,28].forEach(k=>{const x=t+k*st;tone(2450,x,.09,'sine',.5);tone(4900,x,.04,'sine',.12)});return 5.2}
  if(id==='triangel'){[0,.9,1.35,1.8].forEach((x,i)=>{[[1250,.18],[3450,.1],[6750,.06],[9000,.03]].forEach(([f,v])=>tone(f,t+x,i===3?2.2:.9,'sine',v))});return 4.2}
  return 0;
}
function stopSound(){if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}playingId=null;document.querySelectorAll('.eq').forEach(e=>e.classList.remove('on'))}
function playInst(id){
  stopSound();playingId=id;
  const eq=document.querySelector('.eq');if(eq)eq.classList.add('on');
  const done=()=>{if(playingId===id){playingId=null;document.querySelectorAll('.eq').forEach(e=>e.classList.remove('on'))}};
  if(CLIPS[id]){try{const a=new Audio('data:audio/mpeg;base64,'+CLIPS[id]);curAudio=a;a.onended=done;a.play().catch(done)}catch(e){done()}}
  else{const d=synthPerc(id);setTimeout(done,d*1000)}
}
/* melody from your answers */
const SCALE=[261.6,293.7,329.6,349.2,392,440,493.9,523.3,587.3,659.3,698.5,784,880];
const SCY=[58,54,50,46,42,38,34,30,26,22,18,14,10];
function melodyNotes(marks){let k=0;return marks.map(m=>{if(m==='ok'){const n=Math.min(k,SCALE.length-1);k++;return{ok:true,f:SCALE[n],y:SCY[n]}}const n=Math.max(0,k-3);return{ok:false,f:SCALE[n]*0.944,y:SCY[n]}})}
function playMelody(marks){const c=ac();if(!c)return;const t=c.currentTime+.05;melodyNotes(marks).forEach((n,i)=>{tone(n.f,t+i*.28,n.ok?.5:.35,n.ok?'triangle':'sawtooth',n.ok?.18:.06)})}
function staffSVG(marks,total,curIdx){
  const notes=melodyNotes(marks),n=Math.max(total,marks.length),W=70+n*30;
  let s=`<svg class="staff" viewBox="0 0 ${W} 74" width="${W}" role="img" aria-label="Dina svar som noter: ${marks.filter(m=>m==='ok').length} rätt">`;
  for(let i=0;i<5;i++)s+=`<line class="st-line" x1="2" x2="${W-2}" y1="${18+i*8}" y2="${18+i*8}"/>`;
  s+=`<text class="st-clef" x="4" y="57">𝄞</text>`;
  for(let i=0;i<n;i++){const x=58+i*30;
    if(i<notes.length){const nn=notes[i];const cls=nn.ok?'ok':'bad';
      if(nn.y>=58)s+=`<line class="st-line" x1="${x-9}" x2="${x+9}" y1="58" y2="58"/>`;
      if(nn.y<=10)s+=`<line class="st-line" x1="${x-9}" x2="${x+9}" y1="10" y2="10"/>`;
      const up=nn.y>34;
      s+=`<ellipse class="n-${cls}" cx="${x}" cy="${nn.y}" rx="6" ry="4.4" transform="rotate(-20 ${x} ${nn.y})"/>`+(up?`<line class="stem-${cls}" x1="${x+5.6}" x2="${x+5.6}" y1="${nn.y-1}" y2="${nn.y-26}"/>`:`<line class="stem-${cls}" x1="${x-5.6}" x2="${x-5.6}" y1="${nn.y+1}" y2="${nn.y+26}"/>`);
      if(!nn.ok)s+=`<path class="stem-bad" d="M${x+8} ${nn.y-10}l6 6M${x+14} ${nn.y-10}l-6 6"/>`;
    }else s+=`<circle class="${i===curIdx?'n-now':'n-todo'}" cx="${x}" cy="34" r="5"/>`;
  }
  return s+'</svg>';
}

const GNAMES=GROUPS.map(g=>g.name);
function qGroup(id){const i=IBY[id];return{t:'group',id,prompt:`Vilken instrumentgrupp tillhör ${i.name.toLowerCase()}?`,opts:GNAMES,ans:GBY[i.g].name,key:'i:'+id,show:GBY[i.g].name}}
function qListen(id){const i=IBY[id];
  const same=shuffle(INS.filter(x=>x.id!==id&&x.g===i.g&&hasSound(x.id))).slice(0,1);
  const other=shuffle(INS.filter(x=>x.g!==i.g&&hasSound(x.id))).slice(0,3-same.length);
  return{t:'listen',id,prompt:'Lyssna! Vilket instrument hör du?',opts:shuffle([i.name,...same.map(x=>x.name),...other.map(x=>x.name)]),ans:i.name,key:'i:'+id,show:i.name}}
function qListenG(id){const i=IBY[id];return{t:'listeng',id,prompt:'Lyssna! Vilken instrumentgrupp hör du?',opts:GNAMES,ans:GBY[i.g].name,key:'i:'+id,show:GBY[i.g].name}}
function qTF(k){const s=TF[k];return{t:'tf',k,prompt:s.t,opts:['Sant','Falskt'],ans:s.v?'Sant':'Falskt',key:'tf:'+k,show:(s.v?'Sant':'Falskt')}}
function qMC(k){const m=MC[k];return{t:'mc',k,prompt:m.q,opts:shuffle([m.a,...m.o]),ans:m.a,key:'mc:'+k,show:m.a}}
function qAE(id){const i=IBY[id];return{t:'ae',id,prompt:`Är ${i.name.toLowerCase()} akustiskt eller elektriskt?`,opts:['Akustiskt','Elektriskt'],ans:i.sub==='el'?'Elektriskt':'Akustiskt',key:'ae:'+id,show:i.sub==='el'?'Elektriskt':'Akustiskt'}}
function qRiddle(id){const i=IBY[id];return{t:'riddle',id,prompt:i.riddle,key:'i:'+id,show:i.name}}
function qOrder(k){const o=ORDERS[k];return{t:'order',k,prompt:o.q,pool:shuffle(o.items.slice()),key:'or:'+k,show:o.items.map(x=>IBY[x].name).join(', ')}}
function qOdd(){const g=pick(GROUPS.filter(g=>INS.filter(i=>i.g===g.id).length>=3));const three=shuffle(INS.filter(i=>i.g===g.id)).slice(0,3);const odd=pick(INS.filter(i=>i.g!==g.id));
  return{t:'odd',id:odd.id,g:g.id,prompt:'Vilket instrument hör inte hemma bland de andra?',opts:shuffle([...three.map(x=>x.name),odd.name]),ans:odd.name,key:'i:'+odd.id,show:odd.name}}
function qSort(ids){return{t:'sort',items:ids,prompt:ids.length>10?'Dra varje instrument till rätt instrumentgrupp.':'Sortera instrumenten i rätt instrumentgrupp.',key:'sort',show:''}}

function makeRound(mode,missedKeys){
  let ins=shuffle(INS.slice()),ii=0;const nI=f=>{const pool=ins.filter(f||(()=>true));const x=pool[ii++%pool.length];return x.id};
  let tfs=shuffle(TF.map(x=>x.i)),ti=0,mcs=shuffle(MC.map(x=>x.i)),mi=0,ors=shuffle(ORDERS.map(x=>x.i)),oi=0;
  const snd=shuffle(INS.filter(i=>hasSound(i.id)).map(i=>i.id));let si=0;
  const aes=shuffle(INS.filter(i=>i.sub).map(i=>i.id));let ai=0;
  const mk=t=>({group:()=>qGroup(nI()),listen:()=>qListen(snd[si++%snd.length]),listeng:()=>qListenG(snd[si++%snd.length]),tf:()=>qTF(tfs[ti++%tfs.length]),mc:()=>qMC(mcs[mi++%mcs.length]),
    ae:()=>qAE(aes[ai++%aes.length]),riddle:()=>qRiddle(nI()),order:()=>qOrder(ors[oi++%ors.length]),odd:()=>qOdd(),
    sort:()=>qSort(GROUPS.map(g=>pick(INS.filter(i=>i.g===g.id)).id))})[t]();
  const mix=['sort','listen','listen','group','group','tf','tf','mc','order','ae','riddle','odd'];
  if(mode==='missade'){const qs=[];missedKeys.forEach(k=>{const[a,b]=k.split(':');
      if(a==='i'){qs.push(qGroup(b));qs.push(hasSound(b)?qListen(b):qRiddle(b))}
      else if(a==='tf')qs.push(qTF(+b));else if(a==='mc')qs.push(qMC(+b));else if(a==='ae')qs.push(qAE(b));else if(a==='or')qs.push(qOrder(+b))});
    return shuffle(qs).slice(0,16)}
  if(mode==='sortera')return[qSort(shuffle(SHEET20.slice()))];
  if(mode==='lyssna')return shuffle([...Array(7).fill('listen'),...Array(5).fill('listeng')]).map(mk);
  if(mode==='santfalskt')return Array(12).fill('tf').map(mk);
  if(mode==='gator')return Array(10).fill('riddle').map(mk);
  if(mode==='provet')return shuffle(['mc','mc','mc','mc','order','order','ae','ae','group','tf','tf','mc']).map(mk);
  if(mode==='treliv')return Array.from({length:40},()=>mk(pick(mix.filter(t=>t!=='sort'))));
  return shuffle(mix).map(mk);
}
function startGame(missedKeys){
  stopSound();
  const mode=missedKeys?'missade':setupMode;
  G={mode,qs:makeRound(mode,missedKeys),i:0,score:0,answered:0,res:null,missed:[],marks:[],lives:3};
  newQ();view='game';render();window.scrollTo({top:0});
  autoPlay();
}
function newQ(){G.res=null;G.tleft=null;G.ord=[];G.sb={placed:{},wrong:0,missF:[],sel:null,msg:'',flash:null,order:null}}
function autoPlay(){const q=G&&G.qs[G.i];if(q&&(q.t==='listen'||q.t==='listeng')&&soundOn)setTimeout(()=>{if(G&&G.qs[G.i]===q&&!G.res)playInst(q.id)},250)}

/* ---------- GAME ---------- */
const METHOD={group:'Vilken grupp?',listen:'Lyssna',listeng:'Lyssna',tf:'Sant eller falskt?',mc:'Provfråga',ae:'Akustiskt eller elektriskt?',riddle:'Vem är jag?',order:'Storleksordning',odd:'Vem passar inte in?',sort:'Sortera'};
function optsHTML(q,isGroup){
  const lock=!!G.res;
  return `<div class="opts ${isGroup?'three':''}">${q.opts.map((o,i)=>{let cls='';if(lock){if(o===q.ans)cls='good';else if(G.res.chosen===o)cls='bad'}
    const g=isGroup?GROUPS[i].id:null;
    return `<button class="opt ${cls}" ${g?`data-g="${g}"`:''} data-o="${esc(o)}" ${lock?'disabled':''}><span class="k">${i+1}</span>${g?gIcon(g):''}<span>${esc(o)}</span></button>`}).join('')}</div>`;
}
function gameHTML(){
  const q=G.qs[G.i],v=VARS[G.mode],lock=!!G.res;
  const sort20=G.mode==='sortera';
  const status=G.mode==='treliv'?`<span class="hearts">${[0,1,2].map(i=>ICON.heart(i<G.lives)).join('')}</span>`:G.mode==='blixt'?`<span class="timer" aria-label="Tid kvar"><i id="tbar"></i></span>`:'';
  const total=G.mode==='treliv'?Math.max(G.marks.length+1,8):G.qs.length;
  const staff=sort20?'':`<div class="staffwrap">${staffSVG(G.marks,total,G.marks.length)}</div>`;
  let area='';
  if(q.t==='listen'||q.t==='listeng')area=`<div class="player"><button class="play" id="play" aria-label="Spela ljudet">${ICON.play}</button><div class="eq ${playingId===q.id?'on':''}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span class="pencil">Tryck för att lyssna igen.</span></div>`+optsHTML(q,q.t==='listeng');
  else if(q.t==='group')area=optsHTML(q,true);
  else if(q.t==='tf')area=`<div class="tfopts">${q.opts.map((o,i)=>{let cls='';if(lock){if(o===q.ans)cls='good';else if(G.res.chosen===o)cls='bad'}return `<button class="opt ${cls}" data-o="${o}" ${lock?'disabled':''}><span class="k">${i+1}</span>${o}</button>`}).join('')}</div>`;
  else if(q.t==='mc'||q.t==='ae'||q.t==='odd')area=optsHTML(q,false);
  else if(q.t==='riddle')area=`<form class="spell" id="spellf" autocomplete="off"><input id="spin" aria-label="Skriv instrumentets namn" placeholder="Skriv här…" ${lock?'disabled':''} value="${lock?esc(G.res.typed||''):''}" spellcheck="false"><button class="btn" ${lock?'disabled':''}>Svara</button></form>
     ${lock?'':`<div class="keys">${['å','ä','ö'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}<button type="button" id="hint" style="padding:0 .8rem">Ledtråd</button></div><p class="pencil small" id="hinttxt"></p>`}`;
  else if(q.t==='order'){const o=ORDERS[q.k];
    area=`<div class="slots">${[0,1,2].map(n=>{const id=G.ord[n];let cls=id?'full':'';if(lock&&id)cls+=id===o.items[n]?' good':' bad';
      return `<div class="slot ${cls}"><span class="no">${n+1}.</span>${id?esc(IBY[id].name):''}<span class="pencil small" style="margin-left:auto">${o.lab[n]}</span></div>`}).join('')}</div>
      ${lock?'':`<div class="pool">${q.pool.filter(id=>!G.ord.includes(id)).map(id=>`<button class="opt" data-pick="${id}" style="min-width:140px">${esc(IBY[id].name)}</button>`).join('')}${G.ord.length?`<button class="btn light" id="undo">Ångra</button>`:''}</div><p class="help" style="margin-top:10px">Tryck på instrumenten i rätt ordning.</p>`}`;
  }
  else if(q.t==='sort'){const S=G.sb,left=q.items.filter(id=>!S.placed[id]);
    if(!S.order)S.order=q.items.slice();
    area=`${lock?'':`<p class="help">Dra en lapp till rätt grupp. Du kan också trycka på en lapp och sedan på gruppen.</p>
      <div class="tray" id="tray">${S.order.filter(id=>left.includes(id)).map(id=>`<button class="chip ${S.sel===id?'sel':''}" data-id="${id}">${esc(IBY[id].name)}</button>`).join('')||'<span class="pencil">Alla lappar är sorterade!</span>'}</div>`}
      <div class="bins">${GROUPS.map(g=>`<button class="bin ${S.flash===g.id?'flash':''}" data-g="${g.id}" data-bin="${g.id}"><span class="bh">${gIcon(g.id)}${g.name}</span><span class="in">${q.items.filter(id=>S.placed[id]===g.id).map(id=>`<span>${esc(IBY[id].name)}</span>`).join('')}</span></button>`).join('')}</div>
      <p class="dragmsg" id="dmsg">${esc(S.msg||'')}</p><div class="pencil">På plats: <b>${Object.keys(S.placed).length}</b> av ${q.items.length} · Fel försök: <b>${S.wrong}</b></div>`;
  }
  let fb='';
  if(lock){const r=G.res,ok=r.ok;let say=ok?(r.near?'Nästan rätt!':pick(['Rätt!','Snyggt!','Helt rätt!','Bravo!'])):(r.timeout?'Tiden tog slut!':'Inte riktigt.');let more='';
    if(q.t==='sort'){say=ok?(G.sb.wrong?'Alla på plats!':'Alla rätt på första försöket!'):'Alla på plats till slut!';more=G.sb.wrong?`Du hade ${G.sb.wrong} fel försök. ${G.sb.missF.map(id=>`${IBY[id].name} är ${GBY[IBY[id].g].name.toLowerCase()}`).join(', ')}.`:''}
    else if(r.near)more=`Det stavas <b>${esc(q.show)}</b>.`;
    else{
      if(!ok)more=`Rätt svar: <b>${esc(q.show)}</b>. `;
      if(q.t==='tf')more+=esc(TF[q.k].why);
      else if(q.t==='mc'&&MC[q.k].why)more+=esc(MC[q.k].why);
      else if(q.t==='group'||q.t==='listeng'||q.t==='listen'||q.t==='riddle'){const i=IBY[q.id];more+=`${i.name} hör till gruppen ${GBY[i.g].name.toLowerCase()}. ${i.id==='saxofon'?'Saxofonen räknas som träblås för att den har ett rörblad.':''}`}
      else if(q.t==='ae'){const i=IBY[q.id];more+=i.sub==='el'?'Den behöver sladd, förstärkare och el.':'Den hörs utan ström.'}
      else if(q.t==='odd'){const i=IBY[q.id];more+=`${i.name} är ${GBY[i.g].name.toLowerCase()}, de andra är ${GBY[q.g].name.toLowerCase()}.`}
    }
    const last=G.mode==='treliv'?(G.lives<=0||G.i>=G.qs.length-1):G.i>=G.qs.length-1;
    fb=`<div class="fb ${ok?'good':'bad'}" role="status"><div class="say">${say}</div>${more.trim()?`<div class="more">${more}</div>`:''}
      ${(q.t==='listen'||q.t==='listeng')?'':(q.id&&hasSound(q.id)?`<div><button class="btn light" id="hear">${ICON.spk} Hör ${esc(IBY[q.id].name.toLowerCase())}</button></div>`:'')}
      <div><button class="btn" id="next">${last?'Se resultatet':'Nästa fråga'}</button> <span class="pencil small">eller tryck Enter</span></div></div>`;
  }
  const head=q.t==='tf'?`<p class="statement">${esc(q.prompt)}</p>`:`<p class="prompt">${esc(q.prompt)}</p>`;
  return `<div class="bar"><div class="row">${sort20?'':`<span class="stat">Fråga ${G.i+1}${G.mode==='treliv'?'':' av '+G.qs.length}</span>`}<span class="stat">Rätt: ${G.score}</span>${G.mode!=='normal'?`<span class="badge">${v.name}</span>`:''}</div>
    <div class="row">${status}<button class="btn light" id="quit" style="font-size:.95rem;padding:.2rem .7rem">Avsluta</button></div></div>
    ${staff}
    <div class="qcard">${G.i===0&&!lock&&G.mode!=='normal'?`<p class="pencil" style="margin:0 0 8px"><b>${v.name}:</b> ${v.desc}</p>`:''}
    <div class="method">${METHOD[q.t]}</div>${head}${area}${fb}</div>`;
}
function bindGame(){
  const q=G.qs[G.i];
  $('#quit').onclick=()=>{stopSound();view='setup';G=null;render()};
  document.querySelectorAll('.opt[data-o]').forEach(b=>b.onclick=()=>{if(G.res)return;const o=b.dataset.o;resolve(o===q.ans,{chosen:o})});
  const pl=$('#play');if(pl)pl.onclick=()=>playInst(q.id);
  const hr=$('#hear');if(hr)hr.onclick=()=>playInst(q.id);
  const form=$('#spellf');
  if(form&&!G.res){const inp=$('#spin');setTimeout(()=>inp.focus(),30);
    form.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;const i=IBY[q.id];const names=[i.name,...i.alt].map(norm),t=norm(v);
      if(names.includes(t))resolve(true,{typed:v});else if(names.some(n=>strip(n)===strip(t)||lev(n,t)<=(n.length>7?2:1)))resolve(true,{typed:v,near:true});else resolve(false,{typed:v})};
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{inp.value+=b.dataset.k;inp.focus()});
    $('#hint').onclick=()=>{const n=IBY[q.id].name;$('#hinttxt').textContent=`Börjar på "${n[0]}" och har ${n.length} bokstäver: `+n.split('').map((c,i)=>i===0?c:'_').join(' ')}}
  if(q.t==='order'&&!G.res){
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{G.ord.push(b.dataset.pick);sfx('drop');
      if(G.ord.length===3){const o=ORDERS[q.k];resolve(G.ord.every((id,n)=>id===o.items[n]),{})}else render()});
    const u=$('#undo');if(u)u.onclick=()=>{G.ord.pop();render()};
  }
  if(q.t==='sort'&&!G.res)bindSort(q);
  const nx=$('#next');if(nx){nx.onclick=next;nx.focus({preventScroll:true})}
  if(!G.res)startTimer();
}
function resolve(ok,info={}){
  if(G.res)return;stopTimer();
  const q=G.qs[G.i];G.res={ok,...info};G.answered++;G.marks.push(ok?'ok':'bad');
  if(ok)G.score++;
  else{G.lives--;
    if(q.t==='sort')G.sb.missF.forEach(id=>{if(!G.missed.find(m=>m.key==='i:'+id))G.missed.push({key:'i:'+id,q:`Vilken grupp tillhör ${IBY[id].name.toLowerCase()}?`,show:GBY[IBY[id].g].name})});
    else if(!G.missed.find(m=>m.key===q.key))G.missed.push({key:q.key,q:q.t==='listen'||q.t==='listeng'?`Ljudklipp: ${IBY[q.id].name}`:q.prompt,show:q.show})}
  sfx(ok?'ok':'bad');render();
}
function next(){stopSound();
  const end=G.mode==='treliv'?(G.lives<=0||G.i>=G.qs.length-1):G.i>=G.qs.length-1;
  if(end){finish();return}
  G.i++;newQ();render();window.scrollTo({top:0,behavior:'smooth'});autoPlay();
}
function startTimer(){stopTimer();if(!G||G.mode!=='blixt')return;const dur=G.qs[G.i].t==='sort'?60:15;let t=G.tleft??dur;
  timerId=setInterval(()=>{t-=.1;G.tleft=t;const b=$('#tbar');if(b)b.style.width=Math.max(0,t/dur*100)+'%';if(t<=0){stopTimer();resolve(false,{timeout:true})}},100)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function finish(){
  if(G.mode==='sortera'){G.score=G.qs[0].items.length-G.sb.missF.length;G.answered=G.qs[0].items.length;
    G.marks=G.qs[0].items.map(id=>G.sb.missF.includes(id)?'bad':'ok')}
  const st=store.get();st.best=st.best||{};
  if(G.mode!=='missade'){const b=st.best[G.mode];const val=G.mode==='treliv'?G.score:G.score/Math.max(1,G.answered);const old=b?(G.mode==='treliv'?b.s:b.s/b.t):-1;if(val>old)st.best[G.mode]={s:G.score,t:G.answered}}
  store.set(st);view='result';render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- SORT BOARD ---------- */
function dropIn(q,id,gid){
  const S=G.sb;S.sel=null;S.flash=null;
  if(IBY[id].g===gid){S.placed[id]=gid;S.msg='';sfx('drop');
    if(Object.keys(S.placed).length===q.items.length){const allow=q.items.length>10?3:2;resolve(S.wrong<=allow,{});return}}
  else{S.wrong++;if(!S.missF.includes(id))S.missF.push(id);S.flash=gid;S.msg=`${IBY[id].name} hör inte till ${GBY[gid].name.toLowerCase()}. Försök igen!`;sfx('bad')}
  render();
}
function bindSort(q){
  const S=G.sb;let ghost=null,dragId=null,moved=false,sx=0,sy=0,over=null;
  const binAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('[data-bin]')};
  const end=()=>{if(ghost){ghost.remove();ghost=null}if(over){over.classList.remove('over');over=null}dragId=null};
  document.querySelectorAll('.chip').forEach(ch=>{const id=ch.dataset.id;
    ch.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();dragId=id;moved=false;sx=e.clientX;sy=e.clientY;try{ch.setPointerCapture(e.pointerId)}catch(_){}});
    ch.addEventListener('pointermove',e=>{if(dragId!==id)return;
      if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){moved=true;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=IBY[id].name;document.body.appendChild(ghost)}
      if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const b=binAt(e.clientX,e.clientY);if(b!==over){if(over)over.classList.remove('over');over=b;if(b)b.classList.add('over')}}});
    ch.addEventListener('pointerup',e=>{if(dragId!==id)return;const wasMoved=moved;end();
      if(wasMoved){const b=binAt(e.clientX,e.clientY);if(b)dropIn(q,id,b.dataset.bin)}
      else{S.sel=S.sel===id?null:id;S.msg=S.sel?`Tryck nu på gruppen där ${IBY[id].name.toLowerCase()} hör hemma.`:'';
        document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.id===S.sel));const m=$('#dmsg');if(m)m.textContent=S.msg}});
    ch.addEventListener('pointercancel',end);
    ch.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();S.sel=id;S.msg=`Välj nu gruppen för ${IBY[id].name.toLowerCase()}.`;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.id===S.sel));const m=$('#dmsg');if(m)m.textContent=S.msg}});
  });
  document.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{if(G.res)return;if(!S.sel){S.msg='Välj först en lapp.';const m=$('#dmsg');if(m)m.textContent=S.msg;return}dropIn(q,S.sel,b.dataset.bin)});
}

/* ---------- RESULT ---------- */
function resultHTML(){
  const t=G.answered,s=G.score,pc=t?s/t:0,stars=pc>=.9?3:pc>=.7?2:pc>=.45?1:0;
  const comment=G.mode==='treliv'?(s>=15?'Fantastiskt! Du är en riktig kapellmästare.':s>=8?'Starkt jobbat!':'Bra kämpat. Plugga lite och försök igen!')
    :pc>=.9?'Bravo! Du kan dina instrument!':pc>=.7?'Bra jobbat!':pc>=.45?'Bra början, öva lite till.':'Plugga en stund och försök igen.';
  const ms=G.missed.length?`<h3 class="title mt">Att öva på</h3><ul class="missed">${G.missed.map(m=>`<li><span>${esc(m.q)}</span> <span class="ans">${esc(m.show)}</span></li>`).join('')}</ul>`:`<p class="hand mt" style="font-size:1.2rem">Inga missar alls den här gången!</p>`;
  return `<span class="eyebrow">Resultat · ${VARS[G.mode].name}</span>
  <div class="result mt">
    <div class="grade"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M30 70C28 30 90 14 140 22c40 7 52 40 44 66-10 34-70 50-118 38C30 116 20 92 34 60c8-16 30-30 60-34" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/></svg>
      <div style="text-align:center"><div class="sc">${G.mode==='treliv'?s:`${s}/${t}`}</div><div class="hand">${G.mode==='treliv'?'rätt innan tre fel':G.mode==='sortera'?'rätt på första försöket':'rätt svar'}</div></div></div>
    <div><div class="stars" aria-label="${stars} av 3 stjärnor">${[0,1,2].map(i=>ICON.star(i<stars)).join('')}</div><div class="comment">${comment}</div>
      <div class="row mt"><button class="btn" id="again">Spela igen</button><button class="btn hl" id="vary">${ICON.dice} Variera spelet</button>
      ${G.missed.length?`<button class="btn light" id="practice">Öva på missade</button>`:''}<button class="btn light" id="tostudy">Till pluggsidan</button></div></div>
  </div>
  <h3 class="title mt">Din melodi</h3>
  <p class="pencil" style="margin:2px 0 6px">Varje rätt svar klättrar ett steg uppåt i skalan. Fel svar blir röda och halkar ner.</p>
  <div class="row"><div class="staffwrap" style="margin:0">${staffSVG(G.marks,G.marks.length,-1)}</div><button class="btn light" id="melody">${ICON.play} Spela melodin</button></div>
  ${ms}`;
}
function bindResult(){
  const mk=G.missed.map(m=>m.key);
  $('#again').onclick=()=>{setupMode=G.mode==='missade'?'normal':G.mode;startGame()};
  $('#vary').onclick=()=>{setupMode=pick(TWISTS.filter(t=>t!==G.mode));startGame()};
  const p=$('#practice');if(p)p.onclick=()=>startGame(mk);
  $('#tostudy').onclick=()=>{view='study';G=null;render();window.scrollTo({top:0})};
  $('#melody').onclick=()=>playMelody(G.marks);
}

document.addEventListener('keydown',e=>{
  if(view!=='game'||!G)return;
  if(e.target.tagName==='INPUT'&&!G.res)return;
  if(G.res&&e.key==='Enter'){e.preventDefault();next();return}
  const q=G.qs[G.i];
  if(!G.res&&q.opts&&/^[1-9]$/.test(e.key)){const o=q.opts[+e.key-1];if(o!==undefined)resolve(o===q.ans,{chosen:o})}
});

/* ---------- REMEMBER WHERE YOU WERE ---------- */
const SKEY=KEY+'-session';
function saveSession(){try{localStorage.setItem(SKEY,JSON.stringify({view,cover,selI,revealed:[...revealed],setupMode,G,soundOn}))}catch(e){}}
function loadSession(){try{const raw=localStorage.getItem(SKEY);if(!raw)return;const s=JSON.parse(raw);
  cover=!!s.cover;selI=IBY[s.selI]?s.selI:null;revealed=new Set(s.revealed||[]);if(VARS[s.setupMode])setupMode=s.setupMode;if(typeof s.soundOn==='boolean')soundOn=s.soundOn;
  const g=s.G,ok=g&&Array.isArray(g.qs)&&g.qs[g.i]&&g.sb&&Array.isArray(g.marks);
  if((s.view==='game'||s.view==='result')&&ok){G=g;view=s.view}else if(s.view==='setup'||s.view==='game'||s.view==='result')view='setup';else view='study';
 }catch(e){view='study';G=null}}
function saveScroll(){try{localStorage.setItem(SKEY+'-y',String(Math.round(window.scrollY)))}catch(e){}}
let scrollT=null;
window.addEventListener('scroll',()=>{clearTimeout(scrollT);scrollT=setTimeout(saveScroll,200)},{passive:true});
window.addEventListener('pagehide',()=>{saveScroll();saveSession()});

loadSession();
render();
try{const y=+localStorage.getItem(SKEY+'-y')||0;if(y)requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,y)))}catch(e){}
</script>
